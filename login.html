<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Influencer Portal — ProFluencer Awards 2026</title>
<meta name="description" content="Influencer portal login for the ProFluencer Awards 2026. Track your votes, rank, countdown and voting link.">
<link rel="icon" type="image/png" href="assets/img/logo-clean.png">
<link rel="stylesheet" href="assets/css/style-v3.css">
<style>
.divider{display:flex;align-items:center;gap:12px;margin:22px 0;color:var(--muted);font-size:12.5px;text-transform:uppercase;letter-spacing:.08em}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:rgba(255,255,255,.12)}
.demo-tag{display:inline-block;background:rgba(251,191,36,.14);color:#fcd34d;font-size:11px;font-weight:800;letter-spacing:.06em;padding:4px 10px;border-radius:99px;text-transform:uppercase}
</style>
</head>
<body data-page="login">
<header id="site-header"></header>

<div class="page-hero">
  <div class="container" style="max-width:520px">
    <div class="center">
      <img src="assets/img/logo-clean.png" alt="ProFluencer Awards Dubai 2026" style="width:210px;max-width:80%;margin:0 auto 18px">
      <h1 class="sec-title" style="font-size:clamp(26px,5vw,36px)">Influencer Portal</h1>
      <p class="sec-sub" style="margin:0 auto">Log in to track your votes live.</p>
    </div>
  </div>
</div>

<section style="padding-top:10px">
  <div class="container" style="max-width:480px">
    <div class="form-card">
      <div class="form-error" id="ferr"></div>
      <form id="login-form" novalidate>
        <div class="field"><label>Email</label><input name="email" type="email" required placeholder="you@email.com" autocomplete="email"></div>
        <div class="field"><label>Password</label><input name="password" type="password" required placeholder="Your password" autocomplete="current-password"></div>
        <button class="btn btn-gold btn-block" type="submit">Log in to dashboard</button>
        <p class="hint center" style="margin-top:14px">Not nominated yet? <a href="nominate.html" style="color:var(--gold-lt);font-weight:700">Create your nomination</a></p>
      </form>

      <div class="divider">Demo access</div>
      <p style="font-size:13.5px;color:var(--muted);margin-bottom:12px"><span class="demo-tag">Demo</span>&nbsp; Explore a dashboard instantly with a seeded sample profile. Not real people, not real votes.</p>
      <div class="field"><label>Sample nominee</label><select id="demo-pick"></select></div>
      <button class="btn btn-ghost btn-block" id="demo-login">Open demo dashboard</button>
    </div>
  </div>
</section>

<footer id="site-footer"></footer>

<script src="assets/js/data.js"></script>
<script src="assets/js/app-v3.js"></script>
<script>
(function () {
  if (PFA.session()) { location.href = 'dashboard.html'; return; }
  var form = document.getElementById('login-form'), err = document.getElementById('ferr');
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var fd = new FormData(form);
    var inf = PFA.login(fd.get('email'), fd.get('password'));
    if (!inf) {
      err.textContent = 'Email or password not recognized. Check your details or nominate yourself first.';
      err.style.display = 'block';
      return;
    }
    location.href = 'dashboard.html';
  });

  /* demo access — seeded sample profiles only */
  var pick = document.getElementById('demo-pick');
  var demos = PFA.approved().filter(function (x) { return x.id.indexOf('seed-') === 0; }).slice(0, 10);
  pick.innerHTML = demos.map(function (x) {
    var c = PFA.category(x.categoryId);
    return '<option value="' + x.id + '">' + x.name + ' — ' + (c ? c.name : '') + '</option>';
  }).join('');
  document.getElementById('demo-login').addEventListener('click', function () {
    if (!pick.value) { APP.toast('No sample profile available'); return; }
    PFA.setSession(pick.value);
    location.href = 'dashboard.html';
  });
})();
</script>
</body>
</html>
