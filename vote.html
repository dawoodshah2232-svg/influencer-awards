<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Vote — ProFluencer Awards 2026</title>
<meta name="description" content="Vote for your favorite nominee at the ProFluencer Awards 2026. Verify your mobile once, then vote for one nominee per category.">
<link rel="icon" type="image/png" href="assets/img/logo.png">
<link rel="stylesheet" href="assets/css/style.css">
<style>
.otp-box{background:rgba(212,175,55,.07);border:1px solid var(--line);border-radius:16px;padding:20px;margin-top:18px;text-align:left}
.otp-box .demo-code{background:#0a0f1d;border:1px dashed var(--gold);border-radius:12px;padding:12px;margin:12px 0;text-align:center;font-size:22px;letter-spacing:.4em;font-weight:800;color:var(--gold-lt)}
.state-note{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:16px 20px;font-size:14.5px;color:var(--muted);margin-top:16px}
</style>
</head>
<body data-page="vote">
<header id="site-header"></header>

<div class="page-hero">
  <div class="container">
    <div class="vote-hero" id="vote-wrap" style="max-width:620px;margin:0 auto">
      <div class="avatar" id="v-avatar" style="width:110px;height:110px;font-size:42px;margin:0 auto 18px;border:3px solid var(--gold)">?</div>
      <span class="chip" id="v-cat">Category</span>
      <h1 id="v-name" style="margin-top:12px;font-size:clamp(28px,6vw,44px)">Loading…</h1>
      <p class="sec-sub" id="v-bio" style="margin:10px auto 0"></p>
      <div id="v-action" style="margin-top:8px"></div>
      <div class="share-row" id="v-share" style="justify-content:center;margin-top:22px"></div>
    </div>
    <div class="center mt">
      <p class="sec-sub" style="margin:0 auto 18px">Know a creator who deserves a trophy? Nominations are free.</p>
      <a class="btn btn-ghost" href="nominate.html">Nominate an influencer</a>
    </div>
  </div>
</div>

<footer id="site-footer"></footer>

<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
<script>
(function () {
  var id = new URLSearchParams(location.search).get('id');
  var inf = id ? PFA.get(id) : null;
  var wrap = document.getElementById('vote-wrap');

  if (!inf || inf.status !== 'approved') {
    wrap.innerHTML = '<h1 class="sec-title">Profile not available</h1>' +
      '<p class="sec-sub" style="margin:12px auto">This nominee link is invalid or the profile is no longer published.</p>' +
      '<div style="margin-top:22px"><a class="btn btn-gold" href="nominees.html">Browse nominees</a></div>';
    document.title = 'Profile not available — ProFluencer Awards 2026';
    return;
  }

  var cat = PFA.category(inf.categoryId);
  document.title = 'Vote for ' + inf.name + ' — ProFluencer Awards 2026';
  document.getElementById('v-avatar').textContent = PFA.initials(inf.name);
  document.getElementById('v-cat').textContent = cat ? cat.name : '';
  document.getElementById('v-name').textContent = inf.name;
  document.getElementById('v-bio').textContent =
    inf.handle + ' · ' + inf.platform + (inf.followers ? ' · ' + inf.followers + ' followers' : '') +
    (inf.bio ? ' — ' + inf.bio : '');

  var link = location.href.split('#')[0];
  var msg = encodeURIComponent('Vote for ' + inf.name + ' at the ProFluencer Awards 2026: ' + link);
  document.getElementById('v-share').innerHTML =
    '<a class="share-btn" target="_blank" rel="noopener" href="https://wa.me/?text=' + msg + '">Share on WhatsApp</a>' +
    '<a class="share-btn" target="_blank" rel="noopener" href="https://twitter.com/intent/tweet?text=' + msg + '">Share on X</a>' +
    '<button class="share-btn" id="v-copy">Copy link</button>';
  document.getElementById('v-copy').addEventListener('click', function () { APP.copyText(link, 'Voting link copied'); });

  var action = document.getElementById('v-action');
  var state = PFA.votingState();

  if (state === 'upcoming') {
    action.innerHTML = '<div class="state-note"><b style="color:var(--text)">Voting opens October 15, 2026.</b><br>Share this page and come back when the voting window opens.</div>' +
      '<div class="countdown" style="justify-content:center;margin-top:18px"><div class="cd-cell"><b data-cd-d>00</b><span>Days</span></div><div class="cd-cell"><b data-cd-h>00</b><span>Hours</span></div><div class="cd-cell"><b data-cd-m>00</b><span>Mins</span></div><div class="cd-cell"><b data-cd-s>00</b><span>Secs</span></div></div>';
    return;
  }
  if (state === 'closed') {
    var s = PFA.settings();
    action.innerHTML = '<div class="state-note"><b style="color:var(--text)">Voting closed — results under review.</b><br>' +
      (s.resultsPublished ? 'Winners have been announced. <a href="results.html" style="color:var(--gold-lt);font-weight:700">See the results</a>.' : 'Winners will be crowned at the ceremony on December 11, 2026.') + '</div>';
    return;
  }

  /* voting is open */
  var voter = PFA.currentVoter();
  var choice = PFA.voterChoice(inf.categoryId);

  function voteButton() {
    action.innerHTML =
      '<button class="btn btn-gold big-vote" id="do-vote">Vote for ' + inf.name.split(' ')[0] + '</button>' +
      '<p class="hint" style="margin-top:10px">One vote per category · verified voters only · closes Nov 30</p>';
    document.getElementById('do-vote').addEventListener('click', function () {
      var r = PFA.vote(inf.id);
      if (r.ok) { APP.toast('Vote counted for ' + inf.name); render(); }
      else if (r.code === 'ALREADY_VOTED') { APP.toast('You already voted in this category'); render(); }
      else APP.toast('Vote could not be counted right now');
    });
  }

  function otpStep() {
    action.innerHTML =
      '<div class="otp-box"><b>Verify your mobile to vote</b>' +
      '<p class="hint">One verified mobile = one vote per category. This keeps the awards fair.</p>' +
      '<div class="form-2col" style="margin-top:12px"><div class="field" style="margin:0"><input id="otp-phone" inputmode="tel" placeholder="+971 5X XXX XXXX"></div>' +
      '<div class="field" style="margin:0"><button class="btn btn-gold btn-block" id="otp-send" style="padding:14px">Send code</button></div></div>' +
      '<div id="otp-verify" style="display:none;margin-top:12px">' +
      '<div class="demo-code" id="otp-demo"></div>' +
      '<p class="hint center">Demo mode: the SMS code appears above. Production sends a real SMS.</p>' +
      '<div class="form-2col" style="margin-top:8px"><div class="field" style="margin:0"><input id="otp-code" inputmode="numeric" maxlength="6" placeholder="6-digit code"></div>' +
      '<div class="field" style="margin:0"><button class="btn btn-ghost btn-block" id="otp-check" style="padding:14px">Verify & continue</button></div></div>' +
      '<p class="hint" id="otp-err" style="color:#fca5a5;display:none;margin-top:8px"></p></div></div>';
    var phone = null;
    document.getElementById('otp-send').addEventListener('click', function () {
      phone = document.getElementById('otp-phone').value;
      var r = PFA.requestOtp(phone);
      if (!r.ok) { APP.toast(r.error); return; }
      document.getElementById('otp-verify').style.display = 'block';
      document.getElementById('otp-demo').textContent = r.demoCode;
      APP.toast('Verification code sent (demo)');
    });
    document.getElementById('otp-check').addEventListener('click', function () {
      var code = document.getElementById('otp-code').value;
      var r = PFA.verifyOtp(phone, code);
      var e = document.getElementById('otp-err');
      if (!r.ok) { e.textContent = r.error; e.style.display = 'block'; return; }
      APP.toast('Mobile verified — you can now vote');
      render();
    });
  }

  function render() {
    voter = PFA.currentVoter();
    choice = PFA.voterChoice(inf.categoryId);
    if (choice === inf.id) {
      action.innerHTML = '<div class="voted-note">Your vote for ' + inf.name + ' is counted. Thank you.</div>' +
        '<p class="hint" style="margin-top:10px">You can still vote for one nominee in each of the other 9 categories.</p>';
    } else if (choice) {
      var other = PFA.get(choice);
      action.innerHTML = '<div class="state-note"><b style="color:var(--text)">You already voted in ' + (cat ? cat.name : 'this category') + '</b>' +
        (other ? ' — your vote went to ' + other.name + '.' : '.') + '<br>One vote per category; votes cannot be changed.</div>';
    } else if (!voter) {
      otpStep();
    } else {
      voteButton();
    }
  }

  render();
})();
</script>
</body>
</html>
