<body data-page="contact">
<header id="site-header"></header>

<div class="page-hero">
  <div class="container" style="max-width:640px">
    <span class="eyebrow">We reply fast</span>
    <h1 class="sec-title">Contact the team</h1>
    <p class="sec-sub">Nominations, voting support, ceremony, media or partnerships — pick a topic and we'll route it to the right desk.</p>
  </div>
</div>

<section style="padding-top:10px">
  <div class="container" style="max-width:640px">
    <div class="form-card reveal">
      <div class="form-ok" id="ct-ok" style="margin-bottom:14px">Message received — we reply within two working days.</div>
      <form id="ct-form" novalidate>
        <div class="form-error" id="ct-err"></div>
        <div class="form-2col">
          <div class="field"><label>Name *</label><input name="name" required autocomplete="name"></div>
          <div class="field"><label>Email *</label><input name="email" type="email" required autocomplete="email"></div>
        </div>
        <div class="field"><label>Topic</label>
          <select name="subject"><option>Nomination support</option><option>Voting support</option><option>Ceremony & RSVP</option><option>Media</option><option>Partnerships</option><option>Something else</option></select>
        </div>
        <div class="field"><label>Message *</label><textarea name="message" rows="4" required placeholder="How can we help?"></textarea></div>
        <button class="btn btn-gold btn-block" type="submit">Send message</button>
      </form>
    </div>
  </div>
</section>

<footer id="site-footer"></footer>

<script src="assets/js/data.js"></script>
<script src="assets/js/app-v3.js"></script>
<script>
(function () {
  var form = document.getElementById('ct-form'), err = document.getElementById('ct-err');
  var spam = APP.spamGuard(form);
  form.addEventListener('submit', function (e) {
    e.preventDefault(); err.style.display = 'none';
    var sp = spam.check();
    if (sp) {
      if (sp === 'HONEYPOT') { document.getElementById('ct-ok').style.display = 'block'; form.style.display = 'none'; return; }
      err.textContent = sp; err.style.display = 'block'; return;
    }
    var fd = new FormData(form), d = {};
    fd.forEach(function (v, k) { if (k !== 'website') d[k] = String(v).trim(); });
    if (!d.name) { err.textContent = 'Please enter your name.'; err.style.display = 'block'; return; }
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(d.email)) { err.textContent = 'Please enter a valid email.'; err.style.display = 'block'; return; }
    if (!d.message) { err.textContent = 'Please write your message.'; err.style.display = 'block'; return; }
    PFA.addEnquiry(d);
    document.getElementById('ct-ok').style.display = 'block';
    form.style.display = 'none';
  });
})();
</script>
</body>
</html>
